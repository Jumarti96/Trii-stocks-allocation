# Stock Allocation Pipeline - Configuration
#
# Put the tickers or ISINs you can actually buy in stock_tickers/*.csv (every .csv in that
# folder is read), set the four values under "Your setup", and run orchestrator.py.
#
# docs/PARAMETERS.md is the full reference: what reads each key, why the defaults are what
# they are, and the constraints between them. Derived values (period_freq, date_offset,
# future_freq, rf_period) are computed by pipeline/config.py - do not add them here.

# --- Your setup --------------------------------------------------------------------
investment: 100000000         # total capital, in report_currency
report_currency: COP          # 3-letter ISO code for the report: prices, amounts, shares
rf_rate: 0.11                 # risk-free rate IN report_currency; change it with the currency
universe_topn: 500            # stocks to forecast, ranked by liquidity; null disables.
                              # Keep <= ~600 - past that the forecast over-disperses

# --- Data and timing ---------------------------------------------------------------
periods_per_year: 54          # 52 for weekly data, 12 for monthly
interval: "1wk"               # "1wk" for weekly, "1mo" for monthly
days_of_data: 4015            # history to download (days). 5y=1825, 10y=3650, 15y=5475.
                              # Shorter drops training samples, longer drops young names
periods_to_forecast: 24       # forecast horizon, in periods
forecast_decay_lambda: null   # decay of the weights collapsing the forecast into mu;
                              # null scales it with periods_to_forecast

# --- Universe screen (step 2) ------------------------------------------------------
# Picks WHICH stocks to model, before forecasting, on return-neutral criteria only.
universe_strata: null         # null = pure top-N by liquidity; or a list of equal
                              # liquidity bands summing to universe_topn, e.g. [200, 60, 40]
universe_price_floor: 0.0     # drop prices below this, in listing currency
universe_min_market_cap: null # size floor in USD; null disables
unknown_currency: exclude     # unresolvable quote currency: "exclude" | "assume_target"

# --- Portfolio optimisation (step 3) -----------------------------------------------
allocation_top_n: 150         # candidates fed to the optimiser; null = no cap
allocation_ranking: sharpe    # "sharpe" (mu/sigma) | "return" (mu only)
allocation_method: parametric_michaud
                              # uses the forecast: parametric_michaud | msr |
                              #                    equal_weight_topn
                              # model-free:        equal_weight_all | gmv | inverse_vol |
                              #                    momentum | random
# equal_weight_n: 20          # names held by equal_weight_topn / momentum / random;
                              # default = 1/min_weight
momentum_lookback: 24         # trailing periods that 'momentum' ranks on
michaud_spread: 2.0           # draw scale s on Sigma/T
michaud_mc_draws: 1000        # Monte-Carlo mu draws
michaud_seed: 0               # int = reproducible; null = fresh draws
max_weight: 0.15              # maximum portfolio weight per stock
min_weight: 0.05              # minimum portfolio weight per stock; caps the book at 1/this

# --- Output (step 4) ---------------------------------------------------------------
output_path: "results/allocation_output.csv"

# --- Advanced: pipeline internals --------------------------------------------------
# Calibrated defaults; see docs/PARAMETERS.md before changing any of them.
transformer_arch: B                   # 'current' (autoregressive) | 'B' (direct multi-step)
transformer_loss: rank_ic             # 'rank_ic' (ranking objective) | 'auto' (MSE/Huber)
transformer_forecast_window: 24       # multi-step head output length; null -> periods_per_year
n_transformer_runs: 150               # independent runs, averaged
time_window: null                     # input sequence length; null -> periods_per_year
transformer_epochs: 50                # training epochs per run
transformer_warmup_epochs: 5          # LR linear-warmup epochs
transformer_lr: 0.0001                # peak Adam learning rate
transformer_batch_size: 32            # mini-batch size
winsorization_lower_pct: 1            # forecast winsorisation, lower percentile
winsorization_upper_pct: 99           # forecast winsorisation, upper percentile
batch_size: 500                       # tickers per download batch
download_workers: 3                   # parallel batch workers
download_timeout: 30                  # per-batch yfinance timeout (s)
download_warn_fraction: 0.80          # warn if fewer than 80% of tickers downloaded
zero_volume_warn_threshold: 0.25      # warn if > 25% of stocks report zero volume
liquidity_window_fraction: 0.10       # activity lookback = last 10% of the time-series
liquidity_min_active_fraction: 0.85   # keep stocks trading in >= 85% of that window
