# Stock Allocation Pipeline - Configuration
#
# Put the tickers or ISINs you can actually buy in stock_tickers/*.csv (every .csv in
# that folder is read), set the four values under "Your setup", and run orchestrator.py.
# Rationale for the calibrated defaults lives next to the code that uses them, cited
# per-parameter below. Derived values (period_freq, date_offset, future_freq,
# time_window) are computed by pipeline/config.py - do not add them here.

# --- Your setup --------------------------------------------------------------------
investment: 120000000         # total capital, denominated in report_currency
report_currency: COP          # ISO code for the report: prices, amounts, share counts
rf_rate: 0.11                 # risk-free rate IN report_currency (0.11 = 10Y Colombian bond).
                              # Change this whenever you change report_currency.
universe_topn: 500            # how many stocks the model forecasts, picked by liquidity.
                              # No-op if your catalogue is smaller. Do not exceed ~600:
                              # past that the forecast over-disperses badly - see
                              # transformer_model.capacity_report. null disables the screen.
                              # 300 cut straight through the European large caps
                              # (TotalEnergies 303, Siemens 327, LVMH 351, UBS 407) and
                              # left an 89% USD universe - see experiments/universe_profile.py.

# --- Data and timing ---------------------------------------------------------------
periods_per_year: 54          # 52 for weekly data, 12 for monthly
interval: "1wk"               # "1wk" for weekly, "1mo" for monthly
days_of_data: 3650            # historical window to download (days)
periods_to_forecast: 24       # horizon to predict and allocate for; must equal
                              # transformer_forecast_window when transformer_loss is rank_ic

# --- Universe screen (step 2) ------------------------------------------------------
# Picks WHICH stocks to model, before forecasting, on return-neutral criteria only.
# Never screen on past returns: see src/data_intake.select_universe for why.
universe_strata: null         # null = pure top-N by liquidity (mega-caps only at scale).
                              # A list spreads the budget over equal liquidity bands, e.g.
                              # [200, 60, 40] with universe_topn 300. Must sum to topn.
universe_price_floor: 0.0     # drop prices below this (penny stocks), in listing currency
universe_min_market_cap: null # optional USD size floor; costs one yfinance call per stock
unknown_currency: exclude     # stock whose quote currency will not resolve: "exclude" or
                              # "assume_target" (see src/data_intake.convert_currency)

# --- Portfolio optimisation (step 3) -----------------------------------------------
allocation_top_n: 150         # candidates fed to the optimiser; null = no cap
allocation_ranking: sharpe    # "sharpe" (mu/sigma) | "return" (mu only)
allocation_method: parametric_michaud   # "parametric_michaud" | "msr" | "equal_weight_topn"
# equal_weight_n: 12          # names held by equal_weight_topn; default = 1/min_weight
michaud_spread: 2.0           # s; draw scale on Sigma/T. See src/allocation.resampled_michaud
michaud_mc_draws: 1000        # K Monte-Carlo mu draws
michaud_seed: 0               # int = reproducible; null = fresh draws
max_weight: 0.15              # maximum portfolio weight per stock
min_weight: 0.05              # minimum portfolio weight per stock

# --- Output (step 4) ---------------------------------------------------------------
output_path: "results/allocation_output.csv"

# --- Advanced: pipeline internals --------------------------------------------------
# Calibrated defaults. Each is explained where it is consumed; do not change the
# transformer block without reading src/transformer_model.py.
transformer_arch: B                   # 'current' (autoregressive) | 'B' (direct multi-step)
transformer_loss: rank_ic             # 'rank_ic' (ranking objective) | 'auto' (legacy MSE/Huber)
transformer_forecast_window: 24       # multi-step head output length; null -> periods_per_year
n_transformer_runs: 150               # independent runs, averaged (convergence study, 3096393)
time_window: null                     # input sequence length; null -> periods_per_year
transformer_epochs: 50                # training epochs per run
transformer_warmup_epochs: 5          # LR linear-warmup epochs
transformer_lr: 0.0001                # peak Adam learning rate
transformer_batch_size: 32            # mini-batch size
winsorization_lower_pct: 1            # forecast winsorisation, lower percentile
winsorization_upper_pct: 99           # forecast winsorisation, upper percentile
batch_size: 500                       # tickers per download batch
download_workers: 3                   # parallel batch workers
download_timeout: 30                  # per-batch yfinance timeout (s)
download_warn_fraction: 0.80          # warn if fewer than 80% of tickers downloaded
zero_volume_warn_threshold: 0.25      # warn if > 25% of stocks report zero volume
liquidity_window_fraction: 0.10       # activity lookback = last 10% of the time-series
liquidity_min_active_fraction: 0.85   # keep stocks trading in >= 85% of that window
