# Stock Allocation Pipeline - Configuration
# Edit values here. Derived values (period_freq, date_offset, future_freq,
# time_window) are computed automatically by pipeline/config.py - do not add them.

# Data and timing
periods_per_year: 54          # 52 for weekly data, 12 for monthly
interval: "1wk"               # "1wk" for weekly, "1mo" for monthly
days_of_data: 3650            # Historical window to download (days)

# Step 1 download + activity filter
batch_size: 500                 # tickers per download batch
download_workers: 3             # parallel batch workers
download_timeout: 30            # per-batch yfinance timeout (s); generous for a 500-ticker batch

# Transformer model (Step 3)
periods_to_forecast: 24       # How many periods ahead to predict, and the horizon the
                              # allocation is built for. Must equal transformer_forecast_window
                              # when transformer_loss is rank_ic (see the advanced block below).

# Universe screen (Step 2) - which stocks the transformer models at all.
# Distinct from allocation_top_n below: this picks the universe BEFORE forecasting,
# on return-neutral criteria only (liquidity, price, size). Selecting on past
# returns here would hand the model a universe of pre-selected winners and destroy
# any read on whether it has skill - that job belongs to the forecast.
universe_topn: null           # null = no screen (current behaviour, 80-stock universe).
                              # Set when pointing at a large catalogue. Sizing is bounded by
                              # parameters-per-training-sample, NOT by VRAM: stocks are the
                              # feature axis, so widening the universe adds parameters and
                              # zero samples (a sample is a time window; all stocks share one
                              # time axis). Measured at 521 weekly periods = 444 samples:
                              #   80 stocks ->  1,921/sample  (the validated configuration)
                              #  300 stocks ->  3,518/sample  (under 2x validated)
                              # 1000 stocks ->  8,601/sample  (transformer_model warns >4,000)
                              # 3000 stocks -> 23,124/sample  (errors >10,000)
                              # VRAM at 3000 is only ~288MB of tensors; the limit is statistical.
universe_strata: null         # null = pure top-N by liquidity, which at a 3.9k catalogue
                              # returns mega-caps only. A list splits the ranking into equal
                              # bands and takes that many from each, e.g. [200, 60, 40] with
                              # universe_topn 300 = 200 most-liquid third, 60 middle, 40 least.
                              # Must sum to universe_topn.
universe_price_floor: 0.0     # drop sub-floor prices (penny stocks). A data-quality issue at
                              # 3.9k that does not arise at 80. Applied in listing currency.
universe_min_market_cap: null # optional size floor in USD. Requires per-ticker yfinance .info
                              # (~0.6-1.6s each, so 30-80 min for 3.9k). Names with unknown
                              # market cap are KEPT - yfinance reports None for ETFs.

# Portfolio optimisation (Step 4)
allocation_top_n: 150        # candidates fed to optimizer; null = no cap (full universe)
allocation_ranking: sharpe   # "sharpe" (mu/sigma) | "return" (mu only)
allocation_method: parametric_michaud   # "parametric_michaud" | "msr" | "equal_weight_topn"
                                        # equal_weight_topn drops the optimiser and equal-weights the
                                        # top equal_weight_n candidates. It matched parametric_michaud in
                                        # the backtest (net Sharpe 1.132 vs 1.131, head-to-head p=0.949),
                                        # so it is available for comparison; michaud remains the default.
# equal_weight_n: 12                    # names held by equal_weight_topn; default = 1/min_weight
michaud_spread: 2.0                      # s; draw scale on Sigma/T. Lowered from 4.0: s in {0,1,2} ranked
                                         # above {4,6,8} identically across three independent backtest runs
                                         # (different seeds, two cadences). s=1 topped every run but is
                                         # statistically tied with s=2 (p=0.88), so 2.0 takes the tie-break —
                                         # it holds more names and degrades more gracefully if forecasts
                                         # deteriorate. Re-run: experiments/backtest.py --cadence 12,24.
michaud_mc_draws: 1000                   # K Monte-Carlo mu draws
michaud_seed: 0                          # int = reproducible; null = fresh draws
rf_rate: 0.11                 # Risk-free rate (10-Y Colombian bond yield ~11.2%)
max_weight: 0.15              # Maximum portfolio weight per stock
min_weight: 0.05              # Minimum portfolio weight per stock

# Output (Step 5)
investment_cop: 120000000     # Total capital available (COP)
output_path: "results/allocation_output.csv"

# Advanced — pipeline internals (calibrated defaults; regular users don't need to change these)

# Transformer model internals — do not change without a deep understanding of the model.
transformer_arch: B                 # 'current' (autoregressive) | 'B' (direct multi-step). Default: B.
transformer_loss: rank_ic           # 'rank_ic' (cross-sectional ranking objective) | 'auto' (legacy MSE/Huber).
                                    # rank_ic optimises the ordering the optimiser actually consumes; it is
                                    # scale-free, so watch the scale ratio printed per training run.
transformer_forecast_window: 24     # multi-step head output length; null -> periods_per_year. Default: 24 (validated).
n_transformer_runs: 150             # Independent training runs; predictions are averaged.
                                    # 150 from a convergence study: top-N selection stopped changing
                                    # past ~150 runs (commit 3096393). Backtests use 50, where mu
                                    # dispersion is within ~1% of the 150-run value.
time_window: null                   # Input sequence length; null -> periods_per_year.
liquidity_window_fraction: 0.10       # lookback = last 10% of the time-series (proportional to download horizon)
liquidity_min_active_fraction: 0.85   # keep stocks trading in >= 85% of the lookback window
# (liquidity_topn removed: it was declared here but read by no code. Its documented
#  intent - a compute cap before the transformer step - is now universe_topn above.)
download_warn_fraction: 0.80          # warn if fewer than 80% of tickers downloaded successfully
zero_volume_warn_threshold: 0.25      # warn if > 25% of stocks report zero volume (data-source alarm)
winsorization_lower_pct: 1            # lower percentile bound for forecast winsorisation
winsorization_upper_pct: 99           # upper percentile bound for forecast winsorisation
transformer_epochs: 50                # training epochs per transformer run
transformer_warmup_epochs: 5          # LR linear-warmup epochs (out of transformer_epochs)
transformer_lr: 0.0001                # peak Adam learning rate
transformer_batch_size: 32            # mini-batch size for transformer training
